<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- LINKS -->

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>

    <div class="conteiner">
        
        <div class="form-box">
            <h1>Comparação numérica</h1>
            <form id="form-comparison" novalidate>
                <input type="number" id="nunA" placeholder="Digite o número menor" required>
                <p id="campoA-invalido">Digite um número!</p>
                <input type="number" id="nunB" placeholder="Digite o número maior" required>
                <p id="campoB-invalido">Digite um número!</p>
                <button id="btn-comparison" type="submit">Comparar</button>
            </form>
        </div><!-- form-box -->

        <p id="msg-sucesso">
            Tudo ocorreu como o esperado!
        </p>

        <p id="msg-erro">
            Algo não ocorreu como o esperado!
        </p>

    </div><!--Conteiner-->

    <!-- SCRIPTS -->
    
    <script src="script.js"></script>

</body>
</html>
